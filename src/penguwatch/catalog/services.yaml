# The built-in streaming services (penguwatch.catalog.load_catalog). The first start of a new database seeds the
# Services tab from this list; later releases refresh the name, aliases, titles and bundle members of the services
# you never edited, and never the price, renewal, notes or active state. Aliases and titles describe US streaming.
# monthly_cost values are US list prices for an ad-free standard tier (checked 2026-10-11); Apple TV+, Prime Video,
# Hulu, Disney+ and Peacock were not re-checked.
services:
