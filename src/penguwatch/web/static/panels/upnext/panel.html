<!-- Up Next: the next episode of every show in progress (panel.js) -->
<section id="upnext-tab" class="tab-pane" data-panel="upnext" role="tabpanel" aria-labelledby="tab-upnext">
  <div class="page-h">
    <svg class="i" aria-hidden="true"><use href="#i-queue"/></svg>
    <h1 class="page-t">Up Next</h1>
    <span class="page-m">The next episode of everything you're watching.<span data-show-when="remote" hidden data-tpl=" Checking one off updates {library}."></span></span>
  </div>
  <div class="upnext-bar">
    <div class="upnext-chips" id="upnext-chips" role="group" aria-label="Filter Up Next"></div>
    <div class="stats-strip" id="upnext-stats"></div>
  </div>
  <div class="tidy-banner result st-busy" id="tidy-banner" hidden></div>
  <div class="upnext-list" id="upnext-container"></div>
</section>
