<!-- Dialog: create or edit a rating source (panel.js) -->
<div class="modal" id="rating-source-modal" role="dialog" aria-modal="true" aria-labelledby="rating-source-modal-title">
  <div class="modal-content sm">
    <div class="modal-h">
      <svg class="i" aria-hidden="true"><use href="#i-star"/></svg>
      <h2 class="modal-t" id="rating-source-modal-title">New rating source</h2>
      <button type="button" class="btn icon m-close" id="btn-close-rating-source-modal" data-action="close-modal" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <form id="rating-source-form" novalidate>
      <div class="modal-b form">
        <input type="hidden" id="rs-editing">
        <div class="form-grid">
          <div class="field">
            <label for="rs-name">Name</label>
            <input type="text" id="rs-name" class="input" maxlength="60" autocomplete="off" placeholder="e.g. Letterboxd" data-first-focus>
          </div>
          <div class="field">
            <label for="rs-label">Badge label</label>
            <input type="text" id="rs-label" class="input" maxlength="8" autocomplete="off" placeholder="e.g. LB">
          </div>
          <div class="field">
            <label for="rs-id">Id</label>
            <input type="text" id="rs-id" class="input" maxlength="32" autocomplete="off" placeholder="e.g. letterboxd">
            <span class="hint" id="rs-id-hint">Lowercase letters, digits, - and _. Used in the API and in sort and filter; it cannot change later.</span>
          </div>
          <div class="field">
            <label for="rs-decimals">Decimals shown</label>
            <input type="number" id="rs-decimals" class="input num" min="0" max="3" step="1" value="1">
          </div>
          <div class="field">
            <label for="rs-min">Lowest value</label>
            <input type="number" id="rs-min" class="input num" step="any" value="0">
          </div>
          <div class="field">
            <label for="rs-max">Highest value</label>
            <input type="number" id="rs-max" class="input num" step="any" value="10">
          </div>
        </div>
        <label class="check">
          <input type="checkbox" id="rs-cards">
          <span>Show a badge on the library cards</span>
        </label>
        <div class="form-error" id="rs-error" role="alert" hidden></div>
      </div>
      <div class="modal-f">
        <button type="submit" class="btn primary" id="btn-save-rating-source"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Save</button>
      </div>
    </form>
  </div>
</div>
