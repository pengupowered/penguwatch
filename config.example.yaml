# PenguWatch configuration. Copy to config.yaml (git-ignored); docker-compose.yml mounts that copy.
# Installed with uv or pipx: `penguwatch init-config` writes this file to your config folder (`penguwatch paths`
# shows where); it is optional.
#
# Everything except the server address and the database location is changed on the Settings tab. The values in this
# file are read ONCE, at the first start of a version that has the Settings tab, and stored in the database; after
# that the app ignores them (it still reads server.host, server.port and database.db_path every start). Editing
# this file later changes nothing else: use the Settings tab, or Settings > Import for a YAML file. Without a
# config.yaml the app starts from this file's values. See docs/configuration.md.

server:
  # Listen address. Left out: 127.0.0.1 (this computer only) when started with the `penguwatch` command, and every
  # interface in the container, where compose sets PENGUWATCH_HOST. Set "0.0.0.0" to reach it from other devices
  # (and set PENGUWATCH_ACCESS_TOKEN first, see docs/security.md).
  # host: "127.0.0.1"
  port: 8080
  log_level: "info"

# The database is penguwatch.db in the data folder (`penguwatch paths` shows it; /app/data in the container).
# To keep it somewhere else, uncomment these two lines:
# database:
#   db_path: "/path/to/penguwatch.db"

# Which driver fills each role (docs/drivers.md). Left out: SIMKL for all of them. `library` is the one account
# your library is kept in step with; the other roles take a list, tried in order (the first that has the title wins).
# drivers:
#   library: simkl      # or: local (no account; your library, watch history and ratings live only here)
#   catalog: [simkl]    # needs at least one driver
#   schedule: [simkl]   # [] turns the Air Schedule and the calendar feed off
#   discovery: [simkl]  # [] turns Discover off
#
# Without an account (docs/drivers.md): your library stays only in PenguWatch, and TVmaze finds the TV shows. TVmaze has
# no movies and no trending lists, so Discover is off; its data is credited in the page, as its licence asks.
# drivers:
#   library: local
#   catalog: [tvmaze]
#   schedule: [tvmaze]
#   discovery: []

simkl:
  # SIMKL developer client_id (can be created at https://simkl.com/settings/developer/app/new)
  # Leave blank to enter via the Web UI PIN authorization flow or settings page
  client_id: ""
  access_token: ""
  # While the app is in use (a request from a person within idle_after_hours) pull this often...
  auto_sync_interval_minutes: 30
  # ...and after idle_after_hours without any use, only this often. Use wakes an immediate sync.
  idle_after_hours: 12
  idle_sync_interval_minutes: 180
  app_name: "PenguWatch"

household:
  # Who watches: one or two names. Two add "Both" and a "who wants to watch" field on every title (used by the
  # filters, Tonight's Pick and the optimizer's "both want" boost); one name hides that field.
  members: ["Me", "Partner"]

display:
  # The theme a browser shows until its person picks another in the header's theme menu (docs/themes.md): default,
  # nord, dracula, solarized, e-ink, high-contrast or blueprint. An unknown name falls back to default (the log says so).
  theme: default

mcp:
  # The read-only MCP endpoint (POST /mcp): lets an AI assistant such as Claude ask what is up next, what to
  # watch tonight, what the optimizer advises and how the sync is doing. Off by default; /mcp is 404 while it is off.
  # It is guarded like the API (PENGUWATCH_ACCESS_TOKEN, if you set one), so with no token anyone who can reach
  # the port can use it. PENGUWATCH_MCP_ENABLED=true|false overrides this. See docs/mcp.md.
  enabled: false

optimizer:
  max_active_services: 3
  household_priority_boost: 2.0
  ready_to_binge_boost: 1.5

# Your own rating sources: reviews you keep elsewhere (Letterboxd, a spreadsheet, a friend's scores). Titles get
# their values by import (docs/extending.md) or by hand; you can sort and filter by a source, and badges show on the
# cards of sources with show_on_cards. More sources can be added in the app; the ones here are managed by this file.
# ratings:
#   sources:
#     - id: "letterboxd"         # lowercase letters, digits, - and _ (1 to 32 characters)
#       name: "Letterboxd"
#       label: "LB"              # short text for the badge (up to 8 characters)
#       scale_min: 0
#       scale_max: 5
#       decimals: 1
#       show_on_cards: true
