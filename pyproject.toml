[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "penguwatch"
dynamic = ["version"]
description = "TV & movie tracker, streaming subscription rotation optimizer, and two-way SIMKL sync"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    # Windows has no system time zone database; zoneinfo (the household time zone) reads this one there
    'tzdata>=2024.1; sys_platform == "win32"'
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.0"
]

[project.scripts]
penguwatch = "penguwatch.cli:main"

# Same command without a console window (Windows; elsewhere an ordinary script): what the logon task starts.
[project.gui-scripts]
penguwatchw = "penguwatch.cli:main"

[tool.setuptools.dynamic]
# The single source of the version (the tests run from src/ without installing, so metadata cannot be it).
version = {attr = "penguwatch.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
# Everything read at run time that is not a .py file: the dashboard (HTML, CSS, JS, icons, panels) and the example
# config. tests/test_wheel.py builds the wheel and checks it is all there.
penguwatch = ["web/static/**/*", "web/templates/**/*", "config.example.yaml"]
